<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · Pemilihan GENESIS STEI-K '26</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/logo-steik.webp" type="image/webp">
  <link rel="preload" href="fonts/poppins-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="pm step-login">
  <img class="blob blob-left" src="assets/img/blob-left.svg" alt="" aria-hidden="true">
  <img class="blob blob-right" src="assets/img/blob-right.svg" alt="" aria-hidden="true">

  <header class="top">
    <a href="index.html" class="logo-crop top-logo" aria-label="STEI-K — beranda"><img src="assets/img/logo-steik.webp" alt="STEIK" width="709" height="709"></a>
    <nav class="top-nav" aria-label="Pemilihan">
      <span class="muted">Panitia</span>
      <!-- TODO: arahkan ke situs utama -->
      <a href="#" class="home">Home <img src="assets/icons/external-link.svg" alt="" width="15" height="15"></a>
      <span class="sep" aria-hidden="true"></span>
      <span class="year"><img src="assets/icons/ballot.svg" alt="" width="18" height="18">2026 PEMILIHAN GENESIS</span>
    </nav>
  </header>

  <main class="stage">
    <!-- ===== LOGIN =====
         Form ini dikirim ke Worker: saat request, src/views.js menambahkan
         atribut name pada input PIN, mengganti action/method ke POST /sesi,
         dan menyisipkan pesan galat bila ada. Di server statis murni
         (python3 -m http.server) form masih hanya pindah halaman. -->
    <h1 class="sr-only">Login pemilihan GENESIS</h1>
    <span class="logo-crop login-logo"><img src="assets/img/logo-steik.webp" alt="STEIK" width="709" height="709"></span>
    <form class="login-card" action="pilih.html" method="get">
      <label class="sr-only" for="pin">PIN 6 digit</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[0-9]{6}" required placeholder="Enter 6 digit pin">
      <button type="submit" class="btn btn-dark">Login <img src="assets/icons/arrow-right.svg" alt="" width="18" height="18"></button>
    </form>
    <!-- Hasil hanya terisi setelah panitia menutup pemilihan (lihat src/worker.js). -->
    <a class="btn btn-light btn-rekap" href="rekap.html">Lihat Rekapitulasi</a>
  </main>

  <footer class="foot">
    <p>© 2026 STEI-K ‘26</p>
    <p class="foot-links"><span>Accessibility</span><span>Privacy</span><span class="sep" aria-hidden="true"></span><span class="dark">Need help?</span></p>
  </footer>
</div>
</body>
</html>
